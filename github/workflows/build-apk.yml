name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les dossiers
        run: |
          mkdir -p www assets
          [ -f index.html ] && cp index.html www/index.html
          for f in icon-only.png icon-foreground.png icon-background.png; do
            [ -f "$f" ] && cp "$f" assets/"$f"
          done
          ls -R www assets

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        run: npx capacitor-assets generate --android

      - name: Synchroniser le site web
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Dressa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
